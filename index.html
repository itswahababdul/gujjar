<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wahab Gujjar</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--sky:#cfe8f1;--ink:#23301f;--milk:#fffdf6;--btn:#e8553d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--sky);color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
h1{margin:0;font-size:clamp(2rem,6vw,3.2rem);font-weight:800;text-align:center}
.sub{margin:2px 0 16px;text-align:center;font-size:1.05rem}
.scene{position:relative;width:100%;max-width:460px;aspect-ratio:3/4;border:4px solid var(--ink);border-radius:18px;overflow:hidden;background:#222}
.stage{position:absolute;inset:0}
.stage img,.stage svg{position:absolute;inset:0;width:100%;height:100%}
.stage img{object-fit:cover;transition:opacity .6s}
#b{opacity:0}
.smile #b{opacity:1}
#msg{min-height:1.6em;text-align:center;font-size:1.1rem;max-width:460px}
.scene.squeeze .stage{animation:shake .3s ease-in-out}
@keyframes shake{25%{transform:translate(-3px,3px) scale(1.015)}75%{transform:translate(3px,-2px) scale(1.015)}}
.stream{stroke:var(--milk);stroke-width:5;stroke-linecap:round;stroke-dasharray:26 18;opacity:0}
.squeeze .stream{animation:flow .4s linear}
@keyframes flow{0%{opacity:1;stroke-dashoffset:88}90%{opacity:1}100%{opacity:0;stroke-dashoffset:0}}
.drop{fill:var(--milk);opacity:0}
.squeeze .drop{animation:splash .4s ease-out}
.squeeze .d2{animation-delay:.05s}
@keyframes splash{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),-30px)}}
.pop{position:absolute;font-weight:800;font-size:1.4rem;color:#fff;text-shadow:0 2px 0 #000;pointer-events:none;animation:rise .9s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-60px)}}
.panel{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:460px}
button{font:inherit;font-weight:800;font-size:1.5rem;color:#fff;background:var(--btn);border:4px solid var(--ink);border-radius:14px;padding:10px 36px;cursor:pointer;box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s;touch-action:manipulation;user-select:none}
button:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:4px solid #1f6fb2;outline-offset:3px}
.stats{font-size:1.15rem}.stats b{font-size:1.5rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="panel">
  <button id="go" type="button">Milk the buffalo</button>
  <div class="stats">Milk: <b id="litres">0.0</b> L &nbsp;|&nbsp; Buffalo mood: <b id="mood">Suspicious</b></div>
  <div id="msg" aria-live="polite">The buffalo in the back is watching you.</div>
</div>

<script>
const scene = document.getElementById('scene'), btn = document.getElementById('go');
let clicks = 0, streak = 0, idle, t1, t2, held = false;
const LINES = {1:'Buffalo: "Who is this guy?"',3:'The buffalo is warming up.',5:'The buffalo is smiling. This is going well.',10:'The buffalo stopped chewing to watch.',15:'The buffalo wants to leave a 5-star review.',25:'Official dairy partner: confirmed.'};
function milk(){
  clicks++;
  scene.classList.remove('squeeze'); void scene.offsetWidth; scene.classList.add('squeeze');
  const s = document.createElement('span');
  s.className = 'pop'; s.textContent = '+0.1 L';
  s.style.left = (62 + Math.random()*14) + '%'; s.style.top = '62%';
  scene.appendChild(s); setTimeout(() => s.remove(), 900);
  document.getElementById('litres').textContent = (clicks * 0.1).toFixed(1);
  streak++;
  scene.classList.toggle('smile', streak >= 5);
  document.getElementById('mood').textContent = streak >= 15 ? 'Emotionally attached' : streak >= 5 ? 'Delighted' : streak >= 3 ? 'Curious' : 'Suspicious';
  if (LINES[streak]) document.getElementById('msg').textContent = LINES[streak];
  clearTimeout(idle);
  idle = setTimeout(() => { streak = 0; scene.classList.remove('smile'); document.getElementById('mood').textContent = 'Suspicious'; document.getElementById('msg').textContent = 'The buffalo is judging you again.'; }, 6000);
}
btn.addEventListener('click', () => { if (held) { held = false; return; } milk(); });
btn.addEventListener('pointerdown', () => { held = false; t1 = setTimeout(() => { held = true; milk(); t2 = setInterval(milk, 350); }, 450); });
